[project]
name = "mlfs"
version = "0.1.0"
description = "ml-from-scratch: a learn-by-doing machine learning curriculum, and the library you build along the way"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "marimo>=0.25",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pytest>=8.0",
]

[project.optional-dependencies]
# part III onward (build-before-you-use: see AUTHORING.md §7)
torch = ["torch>=2.2", "torchvision>=0.17"]
# comparison baselines + extras used in later labs and capstones
extras = ["scikit-learn>=1.4", "pandas>=2.1", "cvxpy>=1.4", "networkx>=3.2", "tqdm>=4.66"]
all = ["mlfs[torch,extras]"]

[project.entry-points.pytest11]
mlfs = "mlfs.pytest_plugin"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mlfs"]

[tool.setuptools.package-data]
mlfs = ["registry.toml"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -p no:cacheprovider"
norecursedirs = [".*", "templates", "solutions", "__marimo__", "build", "*.egg-info"]

# notebooks run on open, and re-run dependent cells (like live checks) as you edit
[tool.marimo.runtime]
auto_instantiate = true
on_cell_change = "autorun"
