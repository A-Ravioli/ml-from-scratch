name: ci

on:
  push:
  pull_request:

jobs:
  curriculum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install (CPU-only PyTorch)
        run: pip install -e ".[all]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: tooling + contract tests
        run: pytest tests
      - name: CONTRACTS.md up to date
        run: python scripts/contracts_doc.py --check
      - name: audit (structure, placeholders, notebooks)
        run: python scripts/audit.py --marimo
      - name: verify (solutions pass, stubs fail, labs run)
        env:
          MLFS_OFFLINE: "1"
          # one thread per job: 4 parallel jobs x torch's default thread pool oversubscribe the 4-core runner
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python scripts/verify.py --fast -j 4 --timeout 1500
